# ==========================================================
# Alembic Configuration
# TalentSphere Backend
# ==========================================================


[alembic]

# Migration scripts location
script_location = %(here)s/alembic


# Python import path
prepend_sys_path = .


# Path separator
path_separator = os


# Database URL
# NOTE:
# Actual URL is loaded from app settings (.env)
# This value is fallback only

sqlalchemy.url = sqlite:///./talentsphere.db



[post_write_hooks]



# ==========================================================
# Logging Configuration
# ==========================================================


[loggers]

keys = root,sqlalchemy,alembic



[handlers]

keys = console



[formatters]

keys = generic



[logger_root]

level = WARNING

handlers = console

qualname =



[logger_sqlalchemy]

level = WARNING

handlers =

qualname = sqlalchemy.engine



[logger_alembic]

level = INFO

handlers =

qualname = alembic



[handler_console]

class = StreamHandler

args = (sys.stderr,)

level = NOTSET

formatter = generic



[formatter_generic]

format = %(levelname)-5.5s [%(name)s] %(message)s

datefmt = %H:%M:%S